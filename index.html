<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>老照片对比工具 · 需配合豆包AI使用</title>
<style>
  :root{
    --bg: #0d0f13;
    --bg-grad: radial-gradient(1200px 600px at 50% -10%, #1d2230, #0d0f13 60%);
    --panel:#1a1d23;
    --line:#2c313a;
    --txt:#e6e9ee;
    --txt-muted:#697386;
    --accent:#5b8def;
    --ok:#4ecb8d;
    --warn:#f0b94d;
    --stage-bg:#15181d;
    --shadow: 0 20px 55px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.05);
  }
  body.light {
    --bg: #f4f6f9;
    --bg-grad: radial-gradient(1200px 600px at 50% -10%, #e6ebf2, #f4f6f9 60%);
    --panel:#ffffff;
    --line:#d1d7e0;
    --txt:#1f2937;
    --txt-muted:#6b7280;
    --stage-bg:#e5e7eb;
    --shadow: 0 20px 55px rgba(0,0,0,.1), 0 0 0 1px rgba(0,0,0,.05);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    padding:24px 20px 40px;
    background:var(--bg-grad);
    color:var(--txt);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    transition: background .3s, color .3s;
  }
  h1{ font-size:17px; font-weight:600; letter-spacing:.5px; margin:0; color:var(--txt); }

  /* 顶部步骤条 */
  .steps-bar {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 16px;
    width: 100%; max-width: 900px;
    padding: 12px 18px; border-radius: 12px;
    background: color-mix(in srgb, var(--panel) 90%, transparent);
    border: 1px solid var(--line);
    margin-bottom: 6px;
  }
  .step-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 13.5px; color: var(--txt-muted);
    transition: color .3s;
  }
  .step-item.active {
    color: var(--accent);
    font-weight: 600;
  }
  .step-item.done {
    color: var(--ok);
  }
  .step-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--line); color: var(--txt);
    font-size: 12px; font-weight: 700;
    transition: background .3s, color .3s;
  }
  .step-item.active .step-num { background: var(--accent); color: #fff; }
  .step-item.done .step-num { background: var(--ok); color: #fff; }

  /* 声明提示条 */
  .alert-bar {
    display: flex; align-items: center; gap: 8px;
    width: 100%; max-width: 900px;
    padding: 10px 16px; border-radius: 10px;
    background: color-mix(in srgb, var(--warn) 15%, transparent);
    border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent);
    color: var(--txt); font-size: 13.5px;
    line-height: 1.5;
  }
  .alert-bar svg { flex-shrink: 0; color: var(--warn); }

  /* 顶部工具栏 */
  .toolbar{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; width:100%; max-width:900px; }
  .btn{
    position:relative;
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:10px;
    background:var(--panel); border:1px solid var(--line);
    color:var(--txt); font-size:13.5px; cursor:pointer;
    transition:background .18s, border-color .18s, color .18s;
    user-select:none; white-space:nowrap;
  }
  .btn:hover{ background:color-mix(in srgb, var(--panel) 80%, #3b4250); border-color:#3b4250; }
  .btn:active{ transform:translateY(1px); }
  .btn.upload.ready{ border-color:var(--accent); color:var(--accent); }
  .btn.upload.ready::after{ content:"✓"; font-size:12px; }
  .btn.upload input{ position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
  .btn.copy{ background:var(--panel); border-color:var(--line); }
  .btn.copy.copied{ border-color:var(--ok); color:var(--ok); background:color-mix(in srgb, var(--panel) 90%, var(--ok)); }
  .btn.copy.copied::after{ content:"✓"; font-size:13px; }
  .btn.icon{ padding:8px 10px; font-size:15px; }
  .btn-small { padding: 6px 10px; font-size: 13px; }

  select {
    padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--txt); font-size: 13.5px; cursor: pointer;
    outline: none; transition: border-color .18s;
  }
  select:hover { border-color: var(--accent); }

  /* 对齐控制面板 */
  .align-panel {
    display: flex; gap: 6px; align-items: center; justify-content: center;
    flex-wrap: wrap; padding: 6px 12px; border-radius: 10px;
    background: color-mix(in srgb, var(--panel) 95%, transparent);
    border: 1px dashed var(--line);
    width: 100%; max-width: 900px;
  }
  .align-panel span.label { font-size: 12px; color: var(--txt-muted); margin-right: 4px; }

  /* 对比舞台 */
  .stage-wrapper{ position:relative; width:100%; display:flex; justify-content:center; }
  .stage{
    position:relative;
    overflow:hidden;
    border-radius:14px;
    background:var(--stage-bg);
    box-shadow:var(--shadow);
    touch-action:none;
    cursor:ew-resize;
    user-select:none;
    -webkit-user-select:none;
    transition: box-shadow .3s;
  }
  .stage img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
    -webkit-user-drag:none;
    transform-origin: center center;
  }
  #imgNew{ z-index:1; }
  #imgOld{ z-index:2; }

  .divider{
    position:absolute; top:0; bottom:0; left:50%;
    width:2px; margin-left:-1px;
    background:rgba(255,255,255,.92);
    box-shadow:0 0 14px rgba(0,0,0,.75);
    z-index:3; pointer-events:none;
  }
  .handle{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:46px; height:46px; border-radius:50%;
    background:rgba(255,255,255,.95);
    color:#14161a;
    display:grid; place-items:center;
    font-size:17px; line-height:1;
    box-shadow:0 4px 16px rgba(0,0,0,.5);
    transition:transform .15s ease;
  }
  .stage.dragging .handle{ transform:translate(-50%,-50%) scale(1.1); }

  .tag{
    position:absolute; bottom:12px;
    padding:4px 10px; border-radius:6px;
    font-size:12px; letter-spacing:.5px;
    background:rgba(0,0,0,.55); backdrop-filter:blur(6px); color:#fff;
    z-index:4; pointer-events:none; transition:opacity .18s;
  }
  #tagOld{ left:12px; }
  #tagNew{ right:12px; }

  .hint{
    position:absolute; inset:0;
    display:grid; place-items:center;
    text-align:center; padding:0 20px;
    color:var(--txt-muted); font-size:14px;
    z-index:5; pointer-events:none; transition:opacity .3s;
  }
  .hint.hide{ opacity:0; }

  .tip{ margin:0; font-size:12.5px; color:var(--txt-muted); text-align:center; line-height:1.6; }
</style>
</head>
<body>

  <div style="display:flex; justify-content:space-between; align-items:center; width:100%; max-width:900px;">
    <h1 id="i18n-title">老照片对比工具 · 需配合豆包AI使用</h1>
    <div>
      <button type="button" class="btn icon" id="btnTheme" title="Toggle Theme">🌙</button>
      <button type="button" class="btn icon" id="btnLang" title="Switch Language">EN</button>
    </div>
  </div>

  <!-- 步骤引导条（新增） -->
  <div class="steps-bar" id="stepsBar">
    <div class="step-item active" id="step1">
      <span class="step-num">1</span>
      <span id="i18n-step1">复制下方提示词</span>
    </div>
    <div class="step-item" id="step2">
      <span class="step-num">2</span>
      <span id="i18n-step2">粘贴到豆包生图</span>
    </div>
    <div class="step-item" id="step3">
      <span class="step-num">3</span>
      <span id="i18n-step3">下载生成图并上传对比</span>
    </div>
  </div>

  <!-- 声明提示条（新增） -->
  <div class="alert-bar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
    <span id="i18n-alert">注意：本工具不直接生成图片。请先复制提示词，到豆包生成修复图，再回到本页上传对比。</span>
  </div>

  <!-- 上传与操作区 -->
  <div class="toolbar">
    <label class="btn upload" id="btnOld">📷 <span id="i18n-btnOld">上传原图</span>
      <input type="file" accept="image/*" id="fileOld">
    </label>
    <label class="btn upload" id="btnNew">✨ <span id="i18n-btnNew">上传豆包生成图</span>
      <input type="file" accept="image/*" id="fileNew">
    </label>

    <!-- 示例图片选择区 -->
    <span id="i18n-demoLabel" style="font-size:13.5px; color:var(--txt-muted);">加载示例：</span>
    <select id="demoSelect">
      <option value="1">示例 1</option>
      <option value="2">示例 2</option>
      <option value="3">示例 3</option>
      <option value="4">示例 4</option>
      <option value="5">示例 5</option>
    </select>

    <button type="button" class="btn" id="btnReset" title="Reset">🔄 <span id="i18n-btnReset">重置分割</span></button>
    <button type="button" class="btn" id="btnFullscreen" title="Fullscreen">⛶ <span id="i18n-btnFull">全屏</span></button>
    <button type="button" class="btn" id="btnDownload" title="Download">⬇️ <span id="i18n-btnDown">下载对比图</span></button>
  </div>

  <!-- 对齐微调区 -->
  <div class="align-panel">
    <span class="label" id="i18n-alignLabel">对齐微调 (仅移动修复图)：</span>
    <button type="button" class="btn btn-small" id="adjUp">⬆️</button>
    <button type="button" class="btn btn-small" id="adjDown">⬇️</button>
    <button type="button" class="btn btn-small" id="adjLeft">⬅️</button>
    <button type="button" class="btn btn-small" id="adjRight">➡️</button>
    <button type="button" class="btn btn-small" id="adjZoomIn">➕</button>
    <button type="button" class="btn btn-small" id="adjZoomOut">➖</button>
    <button type="button" class="btn btn-small" id="adjReset">🔄 <span id="i18n-adjReset">对齐复位</span></button>
  </div>

  <!-- 提示词复制区 -->
  <div class="toolbar">
    <button type="button" class="btn copy" id="copyZh">📋 <span id="i18n-copyZh">复制中文提示词</span></button>
    <button type="button" class="btn copy" id="copyEn">📋 <span id="i18n-copyEn">Copy English Prompt</span></button>
  </div>

  <div class="stage-wrapper">
    <div class="stage" id="stage">
      <img id="imgNew" alt="修复后的新图">
      <img id="imgOld" alt="原图">
      <div class="divider" id="divider"><div class="handle">⇔</div></div>
      <span class="tag" id="tagOld">原图</span>
      <span class="tag" id="tagNew">修复后</span>
      <div class="hint" id="hint">请先复制上方提示词去豆包生成修复图，再上传原图和修复图进行对比</div>
    </div>
  </div>

  <p class="tip" id="i18n-tip">鼠标拖动 / 手指滑动 / ← → 方向键（按住 Shift 加速）<br>微调：Alt+方向键（步长1px），按住Shift可加速；滚轮缩放</p>

<script>
/* =========================================================
   提示词常量（复制用）
   ========================================================= */
const PROMPT_ZH = "档案级专业老照片修复，8K超高分辨率。清除照片上所有污渍、霉斑、白点、划痕、折痕、黄化老化斑点、胶片损伤，移除截图黑边、界面文字、水印。重建面部、毛发、衣物纹理、背景丢失细节，严格保留人物原始五官样貌、神态表情、人物身份、原图构图、原始胶片摄影风格，禁止篡改面部特征。校正清晰度、光影、对比度、色彩平衡，色彩还原自然真实，不要过度饱和。保留适度原生胶片颗粒质感，不要完全磨平胶片肌理。如果原图为黑白照片，维持黑白，仅在明确要求上色时进行色彩修复。输出干净写实、自然高级的高质量存档照片，无畸变，五官不扭曲。【负面提示词：篡改五官，改变脸型，扭曲面部，换脸，面部变形，多余手指，畸形肢体，油画，动漫，卡通，插画，3D渲染，过度磨皮，皮肤塑料感，去除胶片颗粒，超饱和色彩，夸张美颜，新增物体，改变构图，移动人物，删除人物，添加人物，文字，水印，UI界面，截图边框，黑边，涂鸦，噪点爆炸，强光眩光，重影，模糊畸变，修复过度，不真实皮肤，虚假纹理。】";

const PROMPT_EN = "Archive-grade professional old photo restoration, 8K ultra-high resolution. Remove all stains, mold spots, white specks, scratches, creases, yellow aging spots, film damage on the photo, delete screenshot black borders, UI text and watermarks. Reconstruct lost details of faces, hair, clothing textures and background. Strictly preserve the original facial features, expressions, identity of the people, original composition and original film photography style; do NOT alter facial features. Correct sharpness, lighting, contrast and color balance, restore natural and realistic colors without oversaturation. Keep moderate native film grain texture, do not completely smooth film texture. If the original photo is black and white, keep it monochrome, colorize only upon explicit request. Output clean, realistic, natural high-quality archival photo, no distortion, no distorted facial features. 【Negative Prompt: Facial feature tampering, changed face shape, distorted face, face swap, facial deformation, extra fingers, deformed limbs, oil painting, anime, cartoon, illustration, 3D render, over-smoothing, plastic skin, removed film grain, oversaturated colors, heavy beauty filter, added objects, changed composition, moved people, removed people, added people, text, watermark, UI interface, screenshot border, black border, graffiti, excessive noise, strong glare, double exposure, blur distortion, over-restoration, unreal skin, fake texture.】";

/* =========================================================
   国际化 (i18n) 配置
   ========================================================= */
const i18nData = {
  zh: {
    title: "老照片对比工具 · 需配合豆包AI使用",
    step1: "复制下方提示词",
    step2: "粘贴到豆包生图",
    step3: "下载生成图并上传对比",
    alert: "注意：本工具不直接生成图片。请先复制提示词，到豆包生成修复图，再回到本页上传对比。",
    btnOld: "上传原图",
    btnNew: "上传豆包生成图",
    demoLabel: "加载示例：",
    btnReset: "重置分割",
    btnFull: "全屏",
    btnDown: "下载对比图",
    alignLabel: "对齐微调 (仅移动修复图)：",
    adjReset: "对齐复位",
    copyZh: "复制中文提示词",
    copyEn: "Copy English Prompt",
    tagOld: "原图",
    tagNew: "修复后",
    hint: "请先复制上方提示词去豆包生成修复图，再上传原图和修复图进行对比",
    tip: "鼠标拖动 / 手指滑动 / ← → 方向键（按住 Shift 加速）<br>微调：Alt+方向键（步长1px），按住Shift可加速；滚轮缩放",
    copied: "已复制到剪贴板",
    copyFail: "复制失败，请手动选择",
    alertUpload: "请先上传原图和修复图！",
    demoLoading: "正在加载示例图片..."
  },
  en: {
    title: "Old Photo Compare Tool · Use with Doubao AI",
    step1: "Copy Prompt Below",
    step2: "Generate in Doubao",
    step3: "Download & Upload to Compare",
    alert: "Note: This tool does NOT generate images. Please copy the prompt, generate a restored image in Doubao, then upload it here to compare.",
    btnOld: "Upload Original",
    btnNew: "Upload Generated Image",
    demoLabel: "Load Demo:",
    btnReset: "Reset Split",
    btnFull: "Fullscreen",
    btnDown: "Download Compare",
    alignLabel: "Alignment (Move Restored):",
    adjReset: "Reset Align",
    copyZh: "Copy Chinese Prompt",
    copyEn: "Copy English Prompt",
    tagOld: "Original",
    tagNew: "Restored",
    hint: "Copy the prompt above to Doubao to generate a restored image, then upload both images here to compare.",
    tip: "Drag / Swipe / Arrow keys (Hold Shift to speed up)<br>Align: Alt+Arrows (1px), Hold Shift to speed up; Scroll to zoom",
    copied: "Copied!",
    copyFail: "Copy failed",
    alertUpload: "Please upload both images first!",
    demoLoading: "Loading demo images..."
  }
};

let currentLang = 'zh';

function setLanguage(lang) {
  currentLang = lang;
  const dict = i18nData[lang];

  document.getElementById('i18n-title').innerHTML = dict.title;
  document.getElementById('i18n-step1').innerHTML = dict.step1;
  document.getElementById('i18n-step2').innerHTML = dict.step2;
  document.getElementById('i18n-step3').innerHTML = dict.step3;
  document.getElementById('i18n-alert').innerHTML = dict.alert;
  document.getElementById('i18n-btnOld').innerHTML = dict.btnOld;
  document.getElementById('i18n-btnNew').innerHTML = dict.btnNew;
  document.getElementById('i18n-demoLabel').innerHTML = dict.demoLabel;
  document.getElementById('i18n-btnReset').innerHTML = dict.btnReset;
  document.getElementById('i18n-btnFull').innerHTML = dict.btnFull;
  document.getElementById('i18n-btnDown').innerHTML = dict.btnDown;
  document.getElementById('i18n-alignLabel').innerHTML = dict.alignLabel;
  document.getElementById('i18n-adjReset').innerHTML = dict.adjReset;
  document.getElementById('i18n-copyZh').innerHTML = dict.copyZh;
  document.getElementById('i18n-copyEn').innerHTML = dict.copyEn;
  document.getElementById('i18n-tip').innerHTML = dict.tip;

  document.getElementById('tagOld').innerText = dict.tagOld;
  document.getElementById('tagNew').innerText = dict.tagNew;

  const hint = document.getElementById('hint');
  if (!hint.classList.contains('hide')) {
    hint.innerText = dict.hint;
  }

  document.getElementById('btnLang').innerText = lang === 'zh' ? 'EN' : '中';
}

/* =========================================================
   主逻辑
   ========================================================= */
(function () {
  const stage   = document.getElementById('stage');
  const imgOld  = document.getElementById('imgOld');
  const imgNew  = document.getElementById('imgNew');
  const divider = document.getElementById('divider');
  const hint    = document.getElementById('hint');
  const btnOld  = document.getElementById('btnOld');
  const btnNew  = document.getElementById('btnNew');
  const fileOld = document.getElementById('fileOld');
  const fileNew = document.getElementById('fileNew');
  const tagOld  = document.getElementById('tagOld');
  const tagNew  = document.getElementById('tagNew');
  const demoSelect = document.getElementById('demoSelect');

  let pos    = 50;
  let ar     = 4 / 3;
  let hasOld = false;
  let hasNew = false;

  let newTx = 0;
  let newTy = 0;
  let newScale = 1;

  /* ============ 1. 舞台尺寸自适应 ============ */
  function layout() {
    const maxW = Math.min(window.innerWidth * 0.92, 960);
    const maxH = window.innerHeight * 0.62;
    let w = maxW;
    let h = w / ar;
    if (h > maxH) { h = maxH; w = h * ar; }
    stage.style.width  = Math.round(w) + 'px';
    stage.style.height = Math.round(h) + 'px';
  }
  window.addEventListener('resize', layout);

  /* ============ 2. 设置竖线位置 ============ */
  function setPos(p) {
    pos = Math.min(100, Math.max(0, p));
    imgOld.style.clipPath = 'inset(0 ' + (100 - pos) + '% 0 0)';
    divider.style.left = pos + '%';
    tagOld.style.opacity = pos > 14 ? 1 : 0;
    tagNew.style.opacity = pos < 86 ? 1 : 0;
  }

  /* ============ 3. 应用对齐微调 ============ */
  function applyNewTransform() {
    imgNew.style.transform = `translate(${newTx}px, ${newTy}px) scale(${newScale})`;
  }

  function adjustNew(dx, dy, ds, e) {
    const multiplier = e && e.shiftKey ? 5 : 1;
    newTx += dx * multiplier;
    newTy += dy * multiplier;
    newScale = Math.min(3, Math.max(0.5, newScale + ds * multiplier));
    applyNewTransform();
  }

  /* ============ 4. 读取图片文件 ============ */
  function readFile(file, which) {
    if (!file || !file.type.startsWith('image/')) return;
    const img = which === 'old' ? imgOld : imgNew;
    const btn = which === 'old' ? btnOld : btnNew;
    const url = URL.createObjectURL(file);

    img.onload = function () {
      if (which === 'old' && img.naturalWidth && img.naturalHeight) {
        ar = img.naturalWidth / img.naturalHeight;
        layout();
      }
      if (which === 'old') hasOld = true; else hasNew = true;
      btn.classList.add('ready');
      if (hasOld && hasNew) hint.classList.add('hide');

      if (which === 'new') {
        newTx = 0; newTy = 0; newScale = 1;
        applyNewTransform();
      }

      setPos(pos);
      URL.revokeObjectURL(url);
    };
    img.onerror = function () { URL.revokeObjectURL(url); };
    img.src = url;
  }

  fileOld.addEventListener('change', function (e) {
    readFile(e.target.files[0], 'old');
    e.target.value = '';
  });
  fileNew.addEventListener('change', function (e) {
    readFile(e.target.files[0], 'new');
    e.target.value = '';
  });

  stage.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  stage.addEventListener('drop', e => {
    e.preventDefault();
    const files = e.dataTransfer.files;
    if (files.length >= 2) {
      readFile(files[0], 'old');
      readFile(files[1], 'new');
    } else if (files.length === 1) {
      if (!hasOld) readFile(files[0], 'old');
      else readFile(files[0], 'new');
    }
  });

  /* ============ 5. 拖动交互 ============ */
  let dragging = false;
  function posFromEvent(e) {
    const r = stage.getBoundingClientRect();
    setPos(((e.clientX - r.left) / r.width) * 100);
  }
  stage.addEventListener('pointerdown', e => {
    dragging = true; stage.classList.add('dragging');
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    posFromEvent(e); e.preventDefault();
  });
  stage.addEventListener('pointermove', e => { if (dragging) posFromEvent(e); });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false; stage.classList.remove('dragging');
    try { if (stage.hasPointerCapture(e.pointerId)) stage.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  stage.addEventListener('wheel', e => {
    e.preventDefault();
    const multiplier = e.shiftKey ? 5 : 1;
    const delta = e.deltaY > 0 ? -0.01 : 0.01;
    adjustNew(0, 0, delta * multiplier, e);
  }, { passive: false });

  /* ============ 6. 键盘微调 ============ */
  document.addEventListener('keydown', e => {
    const step = e.shiftKey ? 10 : 2;
    if (e.key === 'ArrowLeft')  { setPos(pos - step); e.preventDefault(); }
    if (e.key === 'ArrowRight') { setPos(pos + step); e.preventDefault(); }

    if (e.altKey) {
      const mult = e.shiftKey ? 5 : 1;
      if (e.key === 'ArrowUp')    { adjustNew(0, -1 * mult, 0, e); e.preventDefault(); }
      if (e.key === 'ArrowDown')  { adjustNew(0, 1 * mult, 0, e); e.preventDefault(); }
      if (e.key === 'ArrowLeft')  { adjustNew(-1 * mult, 0, 0, e); e.preventDefault(); }
      if (e.key === 'ArrowRight') { adjustNew(1 * mult, 0, 0, e); e.preventDefault(); }
    }
  });

  /* ============ 7. 对齐控制按钮绑定（修复版） ============ */
  document.getElementById('adjUp').addEventListener('click', (e) => adjustNew(0, -1, 0, e));
  document.getElementById('adjDown').addEventListener('click', (e) => adjustNew(0, 1, 0, e));
  document.getElementById('adjLeft').addEventListener('click', (e) => adjustNew(-1, 0, 0, e));
  document.getElementById('adjRight').addEventListener('click', (e) => adjustNew(1, 0, 0, e));
  document.getElementById('adjZoomIn').addEventListener('click', (e) => adjustNew(0, 0, 0.01, e));
  document.getElementById('adjZoomOut').addEventListener('click', (e) => adjustNew(0, 0, -0.01, e));

  // 修复：对齐复位功能（添加视觉反馈，防止事件冒泡）
  document.getElementById('adjReset').addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();

    // 重置状态：修复图的位移/缩放归零，并把分割线放回中线(50%)
    newTx = 0;
    newTy = 0;
    newScale = 1;
    applyNewTransform();
    setPos(50);

    // 给用户一个视觉反馈，证明按钮确实生效了
    const btn = e.currentTarget;
    const span = btn.querySelector('span');
    if (span) {
      const originalText = span.innerText;
      span.innerText = currentLang === 'zh' ? '已复位' : 'Reset Done';
      btn.style.borderColor = 'var(--ok)';
      btn.style.color = 'var(--ok)';

      setTimeout(() => {
        span.innerText = originalText;
        btn.style.borderColor = '';
        btn.style.color = '';
      }, 1000);
    }
  });

  /* ============ 8. 加载 GitHub 示例图片 ============ */
  function loadDemoPair(index) {
    // 显示加载提示
    hint.innerText = i18nData[currentLang].demoLoading;
    hint.classList.remove('hide');

    // 重置对齐微调
    newTx = 0; newTy = 0; newScale = 1;
    applyNewTransform();

    // 构造 GitHub 相对路径
    const oldSrc = `Pictures/imgbefore${index}.png`;
    const newSrc = `Pictures/imgafter${index}.png`;

    // 加载原图（决定舞台比例）
    imgOld.onload = function () {
      ar = imgOld.naturalWidth / imgOld.naturalHeight;
      layout();
      hasOld = true;
      btnOld.classList.add('ready');
      setPos(pos);
      checkBothLoaded();
    };
    imgOld.onerror = function () {
      alert(`找不到示例图片：${oldSrc}\n请确认 Pictures 文件夹下是否存在该文件。`);
      hint.innerText = i18nData[currentLang].hint;
      hint.classList.remove('hide');
    };
    imgOld.src = oldSrc;

    // 加载新图
    imgNew.onload = function () {
      hasNew = true;
      btnNew.classList.add('ready');
      newTx = 0; newTy = 0; newScale = 1;
      applyNewTransform();
      setPos(pos);
      checkBothLoaded();
    };
    imgNew.onerror = function () {
      alert(`找不到示例图片：${newSrc}\n请确认 Pictures 文件夹下是否存在该文件。`);
    };
    imgNew.src = newSrc;
  }

  function checkBothLoaded() {
    if (hasOld && hasNew) {
      hint.classList.add('hide');
    }
  }

  // 监听下拉菜单变化
  demoSelect.addEventListener('change', (e) => {
    loadDemoPair(e.target.value);
  });

  // 页面初次加载时，自动加载示例 1
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => loadDemoPair(1), 100);
  });

  /* ============ 9. 重置分割位置 ============ */
  document.getElementById('btnReset').addEventListener('click', () => setPos(50));

  /* ============ 10. 全屏模式 ============ */
  document.getElementById('btnFullscreen').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      stage.requestFullscreen().catch(err => alert(`全屏失败: ${err.message}`));
    } else {
      document.exitFullscreen();
    }
  });

  /* ============ 11. 下载对比图 ============ */
  document.getElementById('btnDownload').addEventListener('click', () => {
    if (!hasOld || !hasNew) {
      alert(i18nData[currentLang].alertUpload);
      return;
    }
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    const w = imgOld.naturalWidth || 1920;
    const h = imgOld.naturalHeight || 1080;
    canvas.width = w;
    canvas.height = h;

    // 1. 绘制底层新图
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.translate(newTx * (w / stage.clientWidth), newTy * (h / stage.clientHeight));
    ctx.scale(newScale, newScale);
    const scaleCoverNew = Math.max(w / imgNew.naturalWidth, h / imgNew.naturalHeight);
    const nw = imgNew.naturalWidth * scaleCoverNew;
    const nh = imgNew.naturalHeight * scaleCoverNew;
    ctx.drawImage(imgNew, -nw / 2, -nh / 2, nw, nh);
    ctx.restore();

    // 2. 绘制上层原图
    const clipWidth = w * (pos / 100);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, clipWidth, h);
    ctx.clip();
    const scaleCoverOld = Math.max(w / imgOld.naturalWidth, h / imgOld.naturalHeight);
    const ow = imgOld.naturalWidth * scaleCoverOld;
    const oh = imgOld.naturalHeight * scaleCoverOld;
    ctx.drawImage(imgOld, (w - ow) / 2, (h - oh) / 2, ow, oh);
    ctx.restore();

    // 3. 绘制分割线
    ctx.beginPath();
    ctx.moveTo(clipWidth, 0);
    ctx.lineTo(clipWidth, h);
    ctx.strokeStyle = 'white';
    ctx.lineWidth = Math.max(2, w / 500);
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.shadowBlur = 10;
    ctx.stroke();

    // 4. 导出下载（使用 toBlob，并捕获跨域/本地文件导致的画布污染错误）
    try {
      canvas.toBlob(function (blob) {
        if (!blob) {
          alert(currentLang === 'zh'
            ? '导出失败：图片过大或浏览器不支持。'
            : 'Export failed: image too large or unsupported.');
          return;
        }
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = `compare_${Date.now()}.jpg`;
        link.href = url;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      }, 'image/jpeg', 0.95);
    } catch (err) {
      alert(currentLang === 'zh'
        ? '导出失败：页面是以本地文件(file://)方式打开的，浏览器禁止导出示例图片。\n请改用「上传原图/上传修复图」，或用本地服务器(如 python -m http.server)/GitHub Pages 打开页面。'
        : 'Export failed: the page is opened via file://, so the browser blocks exporting demo images.\nUpload images manually, or serve the page via a local server / GitHub Pages.');
    }
  });

  /* ============ 12. 主题切换 ============ */
  const btnTheme = document.getElementById('btnTheme');
  btnTheme.addEventListener('click', () => {
    document.body.classList.toggle('light');
    btnTheme.innerText = document.body.classList.contains('light') ? '☀️' : '🌙';
  });

  /* ============ 13. 语言切换 ============ */
  document.getElementById('btnLang').addEventListener('click', () => {
    setLanguage(currentLang === 'zh' ? 'en' : 'zh');
  });

  /* ============ 14. 复制提示词 ============ */
  function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve, reject) => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      ta.setSelectionRange(0, ta.value.length);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('copy failed'));
    });
  }

  function bindCopy(btnId, getText) {
    const btn = document.getElementById(btnId);
    let timer = null;
    btn.addEventListener('click', () => {
      copyToClipboard(getText()).then(() => {
        btn.classList.add('copied');
        const originalHTML = btn.innerHTML;
        btn.innerHTML = i18nData[currentLang].copied;
        clearTimeout(timer);
        timer = setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = originalHTML;
        }, 1600);
      }).catch(() => {
        const originalHTML = btn.innerHTML;
        btn.innerHTML = i18nData[currentLang].copyFail;
        clearTimeout(timer);
        timer = setTimeout(() => { btn.innerHTML = originalHTML; }, 2000);
      });
    });
  }

  bindCopy('copyZh', () => PROMPT_ZH);
  bindCopy('copyEn', () => PROMPT_EN);

  /* ============ 初始化 ============ */
  layout();
  setPos(50);
  setLanguage('zh');
})();
</script>
</body>
